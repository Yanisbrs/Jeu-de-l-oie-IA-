<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Jeu de l'Oie – La Ferme</title>
<style>
  :root{
    --blue-900:#0f2f5c;
    --blue-700:#1c5fb8;
    --blue-500:#3b8be8;
    --blue-300:#9cc6f5;
    --blue-100:#e6f1fd;
    --blue-50:#f4f9ff;
    --white:#ffffff;
    --bg:#d3ece6; /* vert d'eau : mélange de prairie et de ciel */
    --orange:#ff9f1c;
    --ink:#12305a;
    --font:"Nunito","Trebuchet MS","Segoe UI","Comic Sans MS",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
  button{font-family:inherit}
  [hidden]{display:none !important}

  /* ---------- En-tête ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;border-bottom:3px solid rgba(15,47,92,.14)}
  .top-actions{display:flex;gap:10px;align-items:center}
  .brand{display:flex;align-items:center;gap:12px;font-size:1.6rem;font-weight:900;color:var(--blue-700)}
  .brand svg{width:56px;height:50px}
  .btn{border:3px solid var(--blue-900);background:var(--blue-500);color:#fff;font-weight:800;font-size:1.05rem;padding:12px 22px;border-radius:16px;cursor:pointer;box-shadow:0 4px 0 var(--blue-900);transition:transform .08s, box-shadow .08s}
  .btn:hover{background:#2f7ddb}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-900)}
  .btn:disabled{background:var(--blue-300);border-color:#7da5d6;box-shadow:0 4px 0 #7da5d6;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--blue-900)}
  .btn.ghost:hover{background:var(--blue-100)}
  .btn.small{padding:8px 14px;font-size:.9rem;border-radius:12px;box-shadow:0 3px 0 var(--blue-900)}
  .btn.big{font-size:1.4rem;padding:16px 38px;border-radius:20px}
  :focus-visible{outline:4px solid var(--orange);outline-offset:2px}

  /* ---------- Œufs de Pâques (pions) ---------- */
  .egg{--w:24px;display:inline-block;flex:none;position:relative;width:var(--w);height:calc(var(--w)*1.25);
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;border:2.5px solid var(--blue-900);
    box-shadow:0 2px 0 rgba(15,47,92,.35);background:var(--c);vertical-align:middle;overflow:hidden}
  .egg::after{content:"";position:absolute;left:20%;top:12%;width:24%;height:15%;border-radius:50%;background:rgba(255,255,255,.8);transform:rotate(-35deg)}
  .egg.p0{background:repeating-linear-gradient(180deg,transparent 0 14%,rgba(255,255,255,.85) 14% 24%),var(--c)}
  .egg.p1{background:radial-gradient(circle,rgba(255,255,255,.9) 0 20%,transparent 23%) 0 0/50% 34%,var(--c)}
  .egg.p2{background:repeating-linear-gradient(45deg,transparent 0 10%,rgba(255,255,255,.85) 10% 20%),var(--c)}
  .egg.p3{background:linear-gradient(180deg,transparent 36%,rgba(255,255,255,.9) 36% 46%,transparent 46% 54%,rgba(255,255,255,.9) 54% 62%,transparent 62%),var(--c)}
  .egg.p4{background:repeating-linear-gradient(90deg,transparent 0 16%,rgba(255,255,255,.85) 16% 28%),var(--c)}
  .egg.p5{background:conic-gradient(rgba(255,255,255,.85) 25%,transparent 0 50%,rgba(255,255,255,.85) 0 75%,transparent 0) 0 0/40% 30%,var(--c)}
  .egg.p6{background:radial-gradient(circle,rgba(255,255,255,.9) 0 28%,transparent 31%) 0 0/62% 44%,var(--c)}
  .egg.p7{background:repeating-linear-gradient(45deg,transparent 0 12%,rgba(255,255,255,.7) 12% 18%),repeating-linear-gradient(-45deg,transparent 0 12%,rgba(255,255,255,.7) 12% 18%),var(--c)}
  .egg.p8{background:linear-gradient(180deg,transparent 42%,rgba(255,255,255,.9) 42% 62%,transparent 62%),var(--c)}
  .egg.p9{background:radial-gradient(circle,rgba(255,255,255,.9) 0 14%,transparent 17%) 0 0/30% 22%,var(--c)}
  .egg.preview{--w:30px}
  .egg.hop{animation:hop .7s ease-in-out infinite}
  @keyframes hop{50%{transform:translateY(-8cqw)}}

  /* ---------- Écran de configuration ---------- */
  #setup{max-width:760px;margin:32px auto;padding:0 20px 40px}
  .setup-card{border:4px solid var(--blue-900);border-radius:28px;padding:28px;background:var(--blue-50);box-shadow:0 8px 0 var(--blue-300)}
  .setup-hero{display:flex;align-items:center;gap:20px;margin-bottom:8px}
  .setup-hero svg{width:130px;height:116px;flex:none}
  .setup-hero h1{margin:0;font-size:2.2rem;line-height:1.1;color:var(--blue-700)}
  .setup-hero p{margin:6px 0 0;font-size:1.05rem}
  .count-row{display:flex;align-items:center;gap:14px;margin:22px 0 14px;flex-wrap:wrap}
  .count-row label{font-weight:800;font-size:1.15rem}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:44px;height:44px;border-radius:50%;border:3px solid var(--blue-900);background:#fff;font-size:1.5rem;font-weight:900;color:var(--blue-900);cursor:pointer;line-height:1}
  .stepper button:hover:not(:disabled){background:var(--blue-100)}
  .stepper button:disabled{opacity:.4;cursor:not-allowed}
  .stepper output{min-width:46px;text-align:center;font-size:1.8rem;font-weight:900;color:var(--blue-700)}
  .count-hint{font-size:.95rem;opacity:.8}
  #teamFields{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:24px}
  .team-field{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--blue-300);border-radius:16px;padding:8px 12px}
  .team-field input{flex:1;min-width:0;border:none;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:transparent;padding:6px 4px}
  .team-field input:focus{outline:none}
  .team-field:focus-within{border-color:var(--blue-500)}
  .start-row{display:flex;justify-content:center}

  /* ---------- Écran de jeu ---------- */
  #game{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;padding:22px 28px 36px;max-width:1500px;margin:0 auto;align-items:start}
  .board-wrap{border:4px solid var(--blue-900);border-radius:26px;padding:22px;background:var(--blue-50);box-shadow:0 8px 0 var(--blue-300)}
  #board{position:relative;width:100%}

  .cell{position:absolute;z-index:1;container-type:size;border:2.5px solid var(--blue-300);border-radius:14px;background:#fff}
  .cell.ring0{background:#eaf4ff}
  .cell.ring1{background:#fff}
  .cell.ring2{background:#eaf4ff}
  .cell.ring3{background:#fff}
  .cell .num{position:absolute;top:6cqw;left:8cqw;font-weight:900;font-size:17cqw;color:var(--blue-700);line-height:1}
  .cell .lbl{position:absolute;top:8cqw;right:7cqw;max-width:66cqw;text-align:right;font-size:10.5cqw;font-weight:800;color:var(--blue-900);line-height:1;white-space:nowrap;overflow:hidden}
  .cell .icon{position:absolute;left:0;right:0;top:17cqw;bottom:3cqw;display:flex;align-items:center;justify-content:center}
  .cell .icon svg{width:54cqw;height:54cqw}
  .cell .icon.big svg{width:60cqw;height:60cqw}
  .cell .tokens{--w:27cqw;position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:0 2cqw;padding:0 5cqw 3cqw;pointer-events:none;z-index:2}
  .cell .tokens.m{--w:21cqw}
  .cell .tokens.s{--w:16cqw}
  .cell .tokens .egg{border-width:2px}

  .cell.t-oie{background:#d8ecff;border-color:var(--blue-500)}
  .cell.t-hotel{background:#fff1d6;border-color:#f0a63a}
  .cell.t-pont{background:#dff6f1;border-color:#2fb5a0}
  .cell.t-laby{background:#fff6cc;border-color:#d9a800}
  .cell.t-orage{background:#dfe6f2;border-color:#5a6f94}
  .cell.start{background:#e3f7e8;border-color:#3aa655}
  .cell.end{background:#fff3c4;border-color:#e0a800}
  .cell[data-info]{cursor:help}
  .cell:hover{z-index:2}
  .cell[data-info]:hover{transform:translateY(-3px);box-shadow:0 5px 0 rgba(15,47,92,.25)}

  /* ---------- Panneau latéral ---------- */
  .side{display:flex;flex-direction:column;gap:16px}
  .panel{border:3px solid var(--blue-900);border-radius:22px;padding:16px;background:#fff;box-shadow:0 5px 0 var(--blue-300)}
  .panel h2{margin:0 0 10px;font-size:1.05rem;color:var(--blue-700)}
  .turn-name{display:flex;align-items:center;gap:12px;font-size:1.35rem;font-weight:900;margin-bottom:4px}
  .turn-name .egg{--w:28px}
  #status{min-height:1.4em;font-size:.95rem;margin:0 0 12px;color:var(--blue-900)}
  .dice{display:flex;gap:14px;justify-content:center;margin-bottom:8px}
  .die{width:70px;height:70px;border:3px solid var(--blue-900);border-radius:16px;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;box-shadow:0 4px 0 var(--blue-300)}
  .die i{width:12px;height:12px;border-radius:50%;margin:auto;background:transparent}
  .die i.on{background:var(--blue-700)}
  .die.rolling{animation:shake .16s linear infinite}
  @keyframes shake{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
  .total{text-align:center;font-weight:800;min-height:1.5em;margin-bottom:12px}
  #rollBtn{width:100%}

  #teamList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
  #teamList li{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:12px;border:2px solid transparent}
  #teamList li.current{background:var(--blue-100);border-color:var(--blue-500)}
  #teamList .egg{--w:20px;border-width:2px}
  #teamList .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  #teamList .ps{font-weight:900;color:var(--blue-700)}
  #teamList .sk{font-size:.8rem;font-weight:800;color:#b36b00}

  #log{list-style:none;margin:0;padding:0;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
  #log li{padding-left:12px;border-left:4px solid var(--blue-300)}
  #log li:first-child{font-weight:800;border-left-color:var(--blue-500)}

  /* ---------- Infobulle ---------- */
  #tip{position:fixed;z-index:50;max-width:260px;background:var(--blue-900);color:#fff;padding:10px 14px;border-radius:14px;border:3px solid #fff;box-shadow:0 6px 18px rgba(15,47,92,.4);pointer-events:none;font-size:.95rem}
  #tip b{display:block;font-size:1.05rem;margin-bottom:2px;color:#ffd27a}

  /* ---------- Pop-up case spéciale (4 s) ---------- */
  #event{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,47,92,.28);pointer-events:none}
  .ev-card{position:relative;overflow:hidden;width:min(430px,100%);background:#fff;border:5px solid var(--blue-900);border-radius:26px;padding:22px 24px 26px;box-shadow:0 10px 0 var(--blue-300);text-align:center;animation:pop .3s ease-out}
  @keyframes pop{from{transform:scale(.8);opacity:0}}
  .ev-ico svg{width:110px;height:110px}
  .ev-who{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0}
  .ev-who .egg{--w:26px}
  .ev-who b{font-size:1.6rem;color:var(--blue-900)}
  .ev-card h3{margin:2px 0 8px;font-size:1.15rem;color:var(--blue-700)}
  .ev-card p{margin:0;font-size:1.1rem;font-weight:700}
  .ev-bar{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--blue-100)}
  .ev-bar i{display:block;height:100%;width:100%;background:var(--orange);transform-origin:left}
  #event.run .ev-bar i{animation:bar 4s linear forwards}
  @keyframes bar{to{transform:scaleX(0)}}

  /* ---------- Fenêtre de victoire : JACKPOT ! ---------- */
  #win{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;
    background:radial-gradient(circle at 50% 42%, #2a63b5 0%, #12356b 45%, #08162f 100%)}
  .rays{position:absolute;left:50%;top:46%;width:230vmax;height:230vmax;margin:-115vmax 0 0 -115vmax;pointer-events:none;
    background:repeating-conic-gradient(from 0deg, rgba(255,214,90,.32) 0 6deg, transparent 6deg 18deg);
    -webkit-mask-image:radial-gradient(circle, #000 0, transparent 30%);mask-image:radial-gradient(circle, #000 0, transparent 30%);
    animation:spin 22s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #win.go .flash{animation:flash 1s ease-out}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  .win-card{position:relative;z-index:1;background:#fff;border:6px solid var(--blue-900);border-radius:32px;padding:26px 34px 30px;max-width:520px;width:100%;text-align:center;
    box-shadow:0 0 0 6px #ffd43b, 0 0 24px 6px rgba(255,212,59,.5), 0 14px 0 6px var(--blue-300);
    animation:pop .5s cubic-bezier(.2,1.4,.4,1), glow 1.1s ease-in-out .5s infinite alternate}
  @keyframes glow{to{box-shadow:0 0 0 6px #ffd43b, 0 0 60px 20px rgba(255,212,59,.95), 0 14px 0 6px var(--blue-300)}}
  .win-card::before{content:"";position:absolute;inset:-24px;border-radius:52px;border:10px dotted #fff176;z-index:-1;pointer-events:none;animation:bulbs .45s steps(1) infinite alternate}
  @keyframes bulbs{0%{border-color:#fff176}100%{border-color:#ff7b3d}}
  .win-card svg.goose{width:130px;height:116px;animation:bounce .7s ease-in-out infinite alternate}
  @keyframes bounce{to{transform:translateY(-10px) rotate(-4deg)}}
  .jp{margin:4px 0 6px;font-size:clamp(2.4rem,9vw,3.8rem);line-height:1.05;font-weight:900;letter-spacing:.03em;
    background:linear-gradient(90deg,#ff9f1c,#ffe066,#ff9f1c,#ffe066,#ff9f1c);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-stroke:2.5px var(--blue-900);paint-order:stroke fill;animation:shine 1.4s linear infinite, throb .6s ease-in-out infinite alternate}
  @keyframes shine{to{background-position:-200% 0}}
  @keyframes throb{to{transform:scale(1.06)}}
  .win-who{display:flex;justify-content:center;margin:6px 0 2px}
  .win-who .egg{--w:44px;border-width:3px}
  .win-card p{margin:6px 0 20px;font-size:1.1rem}
  .win-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  @media (max-width:1050px){
    #game{grid-template-columns:1fr;padding:16px}
    .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  }
  @media (prefers-reduced-motion:reduce){
    .egg.hop,.die.rolling,.ev-card,.win-card,.win-card::before,.win-card svg.goose,.jp,.rays{animation:none !important}
  }
</style>
</head>

    <circle cx="24" cy="19" r="6.5" fill="#8d5524"/></g></symbol>
  <symbol id="d-tree" viewBox="0 0 48 48"><g stroke="#0f2f5c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">

<script>
(() => {
  "use strict";

  /* ================= Données ================= */
  const LAST = 63, COLS = 9, ROWS = 7, EVENT_MS = 4000;
  const COLORS = ["#ef5350","#ffa726","#fbc02d","#66bb6a","#26c6da","#5c6bc0","#ab47bc","#ec407a","#8d6e63","#42a5f5"];

  const TYPES = {
    oie:   {label:"L'Oie",      icon:"goose",   cls:"t-oie",   desc:"Relancez les dés et avancez encore !"},
    hotel: {label:"Hôtel",      icon:"i-house", cls:"t-hotel", desc:"Vous vous reposez : passez votre prochain tour."},
    pont:  {label:"Pont",       icon:"i-bridge",cls:"t-pont",  desc:"Vous traversez le pont de bois : avancez de 6 cases."},
    laby:  {label:"Labyrinthe", short:"Maïs", icon:"i-corn",  cls:"t-laby",  desc:"Vous vous perdez dans le maïs : reculez de 5 cases."},
    orage: {label:"Orage",      icon:"i-storm", cls:"t-orage", desc:"Un orage éclate : retour à la case départ !"}
  };
  const SPECIALS = {};
  const place = (type, list) => list.forEach(n => SPECIALS[n] = type);
  place("oie",   [9,18,27,36,45,54]);
  place("hotel", [13,31,49]);
  place("pont",  [6,24,40]);
  place("laby",  [22,43,56]);
  place("orage", [34,59]);

  const DECORS = ["d-sunflower","d-tree","d-apple","d-carrot","d-wheat","d-mushroom","d-tulip","d-chick","d-cow","d-pig","d-sheep","d-ladybug","d-daisy","d-bee"];

  /* ================= Plateau en spirale (9 x 7 = 63 cases) ================= */
  const path = [];
  (function buildSpiral(){
    let top=0, bottom=ROWS-1, left=0, right=COLS-1;
    while(top<=bottom && left<=right){
      for(let c=left;c<=right;c++) path.push([bottom,c]);
      bottom--;
      for(let r=bottom;r>=top;r--) path.push([r,right]);
      right--;
      if(top<=bottom){ for(let c=right;c>=left;c--) path.push([top,c]); top++; }
      if(left<=right){ for(let r=top;r<=bottom;r++) path.push([r,left]); left++; }
    }
  })();

  /* ================= Sons (générés dans le navigateur, aucun fichier) ================= */
  const SND = (() => {
    let ctx = null, master = null, enabled = true, target = null, bus = null;
    function ensure(){
      if(!enabled) return null;
      if(!ctx){
        const C = window.AudioContext || window.webkitAudioContext;
        if(!C) return null;
        ctx = new C(); master = ctx.createGain(); master.gain.value = 0.7; master.connect(ctx.destination);
      }
      if(ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    function tone(f, dur, o = {}){
      const c = ensure(); if(!c) return;
      const t = c.currentTime + (o.at || 0);
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(f, t);
      if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
      if(o.vib){
        const lfo = c.createOscillator(), lg = c.createGain();
        lfo.frequency.value = 9; lg.gain.value = o.vib;
        lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t); lfo.stop(t + dur + 0.05);
      }
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol ?? 0.2, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g);
      let out = g;
      if(o.lp){ const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = o.lp; g.connect(lp); out = lp; }
      out.connect(target || master);
      osc.start(t); osc.stop(t + dur + 0.05);
    }
    function noise(dur, o = {}){
      const c = ensure(); if(!c) return;
      const t = c.currentTime + (o.at || 0);
      const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = o.type || "bandpass"; f.frequency.value = o.f || 2000; f.Q.value = o.q || 1;
      const g = c.createGain(), v = o.vol ?? 0.2;
      g.gain.setValueAtTime(0.0001, t);
      if(o.attack) g.gain.linearRampToValueAtTime(v, t + o.attack); else g.gain.exponentialRampToValueAtTime(v, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(target || master);
      src.start(t);
    }
    /* trompette : deux dents-de-scie légèrement désaccordées + filtre qui s'ouvre */
    function brass(f, dur, at = 0, vol = 0.14){
      const c = ensure(); if(!c) return;
      const t = c.currentTime + at;
      const g = c.createGain(), lp = c.createBiquadFilter();
      lp.type = "lowpass"; lp.Q.value = 3;
      lp.frequency.setValueAtTime(500, t); lp.frequency.exponentialRampToValueAtTime(3000, t + 0.09);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.04);
      g.gain.setValueAtTime(vol, t + Math.max(0.05, dur - 0.1));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      [1, 1.006].forEach(k => {
        const o = c.createOscillator(); o.type = "sawtooth"; o.frequency.value = f * k;
        o.connect(lp); o.start(t); o.stop(t + dur + 0.05);
      });
      lp.connect(g); g.connect(target || master);
    }
    const bell = (f, at) => { tone(f, 0.35, {vol: 0.07, at}); tone(f*2.76, 0.2, {vol: 0.03, at}); };
    const PENTA = [523, 587, 659, 784, 880];
    return {
      unlock: ensure,
      get enabled(){ return enabled; },
      toggle(){ enabled = !enabled; if(enabled) ensure(); return enabled; },
      /* dés qui roulent : cliquetis, puis « toc » à l'arrêt */
      diceClick(){ noise(0.05, {f: 1800 + Math.random()*2500, q: 3, vol: 0.2}); tone(200 + Math.random()*120, 0.04, {type:"square", vol: 0.04}); },
      diceLand(){ tone(170, 0.2, {to: 90, vol: 0.3}); noise(0.09, {f: 900, vol: 0.15}); },
      /* un pas du pion : petite note qui monte la gamme */
      step(i){ const f = PENTA[i % PENTA.length]; tone(f, 0.09, {type:"triangle", vol: 0.18}); tone(f*2, 0.04, {vol: 0.04}); },
      /* une mélodie par case spéciale */
      special(type){
        if(type === "oie"){            // coin-coin
          tone(420, 0.2, {type:"sawtooth", to: 300, vol: 0.14, lp: 1400});
          tone(440, 0.2, {type:"sawtooth", to: 310, vol: 0.14, lp: 1400, at: 0.27});
        } else if(type === "hotel"){   // berceuse qui s'endort
          [659, 523, 392].forEach((f,i) => tone(f, 0.5, {type:"triangle", vol: 0.16, at: i*0.3}));
        } else if(type === "pont"){    // toc-toc sur le bois puis arpège montant
          tone(180, 0.08, {type:"square", vol: 0.1, lp: 600});
          tone(200, 0.08, {type:"square", vol: 0.1, lp: 600, at: 0.12});
          [523, 659, 784, 1047].forEach((f,i) => tone(f, 0.16, {type:"triangle", vol: 0.16, at: 0.3 + i*0.1}));
        } else if(type === "laby"){    // on se perd : notes qui chancellent et descendent
          tone(440, 0.5, {to: 140, vol: 0.2, vib: 25});
          tone(330, 0.6, {to: 110, vol: 0.2, vib: 25, at: 0.45});
        } else if(type === "orage"){   // éclair puis tonnerre
          tone(1500, 0.18, {type:"sawtooth", to: 80, vol: 0.14});
          noise(0.15, {at: 0.02, f: 3000, vol: 0.3});
          noise(1.6, {type:"lowpass", f: 500, q: 0.7, vol: 0.55, attack: 0.2, at: 0.1});
        }
      },
      /* JACKPOT : comme une machine à sous de casino qui paie le gros lot */
      jackpot(){
        const c = ensure(); if(!c) return;
        bus = c.createGain(); bus.gain.value = 0.65; bus.connect(master); target = bus;
        const R = (a,b) => a + Math.random()*(b-a);
        // éclair de lumière + cymbale
        tone(700, 0.6, {to: 3500, vol: 0.1});
        noise(1.6, {type:"highpass", f: 6500, vol: 0.25});
        // roulement de caisse claire
        for(let i=0;i<9;i++) noise(0.05, {at: i*0.055, f: 2500, q: 0.8, vol: 0.12});
        // fanfare de trompettes : ta-ta-ta TAAA, ta-ta TAAAAA
        [[523,.14,.55],[523,.14,.73],[523,.14,.91],[659,.55,1.09],[587,.2,1.65],[659,.2,1.88],[784,.95,2.1]].forEach(([f,d,at]) => {
          brass(f, d, at, 0.15); brass(f/2, d, at, 0.07);
        });
        // accord final éclatant + cymbale
        [523, 659, 784, 1047].forEach(f => brass(f, 1.6, 3.2, 0.12));
        noise(2, {at: 3.2, type:"highpass", f: 6000, vol: 0.28});
        // sonnerie de machine à sous
        for(let i=0;i<34;i++) bell(i%2 ? 2093 : 2637, 0.9 + i*0.11);
        // pluie de pièces
        for(let i=0;i<90;i++){
          const at = R(0.8, 5.6), f = R(2400, 5200);
          tone(f, 0.07, {vol: 0.05, at}); tone(f*1.5, 0.06, {vol: 0.03, at: at + 0.03});
          noise(0.03, {at, type:"highpass", f: 7000, vol: 0.05});
        }
        // glissando de paillettes
        [1047,1319,1568,2093,2637,3136,4186].forEach((f,i) => tone(f, 0.3, {vol: 0.08, at: 3.2 + i*0.06}));
        // la foule applaudit
        noise(3, {f: 1800, q: 0.5, vol: 0.2, attack: 0.5, at: 1.8});
        for(let i=0;i<50;i++) noise(0.03, {at: R(2, 6.5), f: R(2500, 4500), q: 0.6, vol: 0.07});
        target = null;
      },
      stop(){
        if(!bus || !ctx) return;
        bus.gain.cancelScheduledValues(ctx.currentTime);
        bus.gain.setTargetAtTime(0, ctx.currentTime, 0.06);
        bus = null;
      }
    };
  })();

  /* ================= Éléments ================= */
  const $ = id => document.getElementById(id);
  const setup=$("setup"), game=$("game"), board=$("board"), tip=$("tip"), ev=$("event");
  let teams=[], cur=0, busy=false, over=false, count=2, names=[], gid=0;
  const cellEls = [];
  const NS = "http://www.w3.org/2000/svg";

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const svgUse = id => '<svg viewBox="0 0 ' + (id==="goose" ? "130 112" : "48 48") + '"><use href="#' + id + '"/></svg>';

  /* ================= Œufs de Pâques ================= */
  function makeEgg(t, cls){
    const e = document.createElement("span");
    e.className = "egg p" + (t.idx % 10) + (cls ? " " + cls : "");
    e.style.setProperty("--c", t.color);
    return e;
  }

  /* ================= Configuration ================= */
  function renderFields(){
    const box = $("teamFields");
    box.querySelectorAll("input").forEach((inp,i)=>{ names[i]=inp.value; });
    box.innerHTML = "";
    for(let i=0;i<count;i++){
      const row = document.createElement("div");
      row.className = "team-field";
      const inp = document.createElement("input");
      inp.type = "text"; inp.maxLength = 16;
      inp.placeholder = "Équipe " + (i+1);
      inp.value = names[i] || "";
      inp.setAttribute("aria-label", "Nom de l'équipe " + (i+1));
      row.append(makeEgg({idx:i,color:COLORS[i]}, "preview"), inp);
      box.appendChild(row);
    }
    $("countOut").textContent = count;
    $("minus").disabled = count<=2;
    $("plus").disabled = count>=10;
  }
  $("minus").onclick = () => { if(count>2){ count--; renderFields(); } };
  $("plus").onclick  = () => { if(count<10){ count++; renderFields(); } };

  /* ================= Construction du plateau ================= */
  function buildBoard(){
    board.innerHTML = "";
    cellEls.length = 0;
    for(let n=1;n<=LAST;n++){
      const [r,c] = path[n-1];
      const ring = Math.min(r, c, ROWS-1-r, COLS-1-c);
      const el = document.createElement("div");
      el.className = "cell ring" + (ring % 4);
      el.dataset.n = n;

      const num = document.createElement("span");
      num.className = "num"; num.textContent = n;
      el.appendChild(num);

      const type = SPECIALS[n];
      let icon=null, label="", info=null, big=false;
      if(n===1){ el.classList.add("start"); icon="i-flag"; label="Départ"; big=true; info=["Départ","Toutes les équipes partent d'ici. Suivez les flèches !"]; }
      else if(n===LAST){ el.classList.add("end"); icon="i-nest"; label="Arrivée"; big=true; info=["Arrivée","Il faut tomber pile sur la case 63. Sinon, on rebondit en arrière !"]; }
      else if(type){
        const t = TYPES[type];
        el.classList.add(t.cls);
        icon = t.icon; label = t.label; big = true; info = [t.label, t.desc];
      } else {
        icon = DECORS[(n*5) % DECORS.length];
      }
      const ic = document.createElement("div");
      ic.className = "icon" + (big ? " big" : "");
      ic.setAttribute("aria-hidden","true");
      ic.innerHTML = svgUse(icon);
      el.appendChild(ic);
      if(label){
        const lb = document.createElement("span");
        lb.className = "lbl"; lb.textContent = (type && TYPES[type].short) || label;
        el.appendChild(lb);
      }
      if(info){ el.dataset.info = info.join("|"); el.tabIndex = 0; }

      const tk = document.createElement("div");
      tk.className = "tokens";
      el.appendChild(tk);

      board.appendChild(el);
      cellEls[n] = el;
    }
    layoutBoard();
  }

  /* Placement des cases : celles qui se suivent sont presque collées (même « anneau » de la spirale),
     les anneaux voisins sont nettement écartés, et les cases rétrécissent légèrement vers le centre. */
  const GAP_IN = 0.04;    // espace entre deux cases qui se suivent (en fraction d'une case)
  const SHRINK = 0.07;    // réduction de taille d'une case à chaque anneau vers le centre
  let lastW = 0;
  function layoutBoard(){
    const Wb = board.clientWidth;
    if(!Wb || !cellEls[1]) return;
    lastW = Wb;
    const s0 = Wb / (COLS + (COLS-1)*GAP_IN), g = s0*GAP_IN;
    const Hb = ROWS*s0 + (ROWS-1)*g;
    board.style.height = Hb + "px";
    for(let n=1;n<=LAST;n++){
      const [r,c] = path[n-1];
      const k = Math.min(r, c, ROWS-1-r, COLS-1-c);
      const sk = s0*(1 - k*SHRINK);
      const nk = COLS-2*k, mk = ROWS-2*k;
      const Wk = nk*sk + (nk-1)*g, Hk = mk*sk + (mk-1)*g;
      const x = (Wb-Wk)/2 + (c-k)*(sk+g), y = (Hb-Hk)/2 + (r-k)*(sk+g);
      const el = cellEls[n];
      el.style.left = x.toFixed(1) + "px"; el.style.top = y.toFixed(1) + "px";
      el.style.width = sk.toFixed(1) + "px"; el.style.height = sk.toFixed(1) + "px";
    }
  }
  new ResizeObserver(() => { if(board.clientWidth !== lastW) layoutBoard(); }).observe(board);

  /* ================= Rendu dynamique ================= */
  function renderTokens(){
    cellEls.forEach(el => el && (el.querySelector(".tokens").replaceChildren()));
    const byCell = {};
    teams.forEach(t => (byCell[t.pos] = byCell[t.pos] || []).push(t));
    for(const pos in byCell){
      const list = byCell[pos];
      const tk = cellEls[pos].querySelector(".tokens");
      tk.className = "tokens" + (list.length>=7 ? " s" : list.length>=4 ? " m" : "");
      list.forEach(t => {
        const e = makeEgg(t, (t.idx===cur && !over) ? "hop" : "");
        e.title = t.name;
        tk.appendChild(e);
      });
    }
  }

  function renderPanel(){
    const t = teams[cur];
    $("turnName").textContent = t.name;
    $("turnEgg").replaceChildren(makeEgg(t));

    const ul = $("teamList");
    ul.innerHTML = "";
    teams.forEach((m,i)=>{
      const li = document.createElement("li");
      if(i===cur && !over) li.className = "current";
      const nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = m.name;
      const ps = document.createElement("span");
      ps.className = "ps"; ps.textContent = "case " + m.pos;
      li.append(makeEgg(m), nm);
      if(m.skip>0){
        const sk = document.createElement("span");
        sk.className = "sk"; sk.textContent = "💤";
        sk.title = "Passe son prochain tour";
        li.appendChild(sk);
      }
      li.appendChild(ps);
      ul.appendChild(li);
    });
    renderTokens();
  }

  function setStatus(s){ $("status").textContent = s; }
  function log(msg){
    const li = document.createElement("li");
    li.textContent = msg;
    const ul = $("log");
    ul.prepend(li);
    while(ul.children.length>7) ul.lastChild.remove();
  }

  /* ================= Dés ================= */
  const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  function showDie(el, v){
    el.innerHTML = "";
    for(let i=0;i<9;i++){
      const s = document.createElement("i");
      if(PIPS[v].includes(i)) s.className = "on";
      el.appendChild(s);
    }
    el.setAttribute("aria-label", "Dé : " + v);
  }
  const rnd = () => 1 + Math.floor(Math.random()*6);

  async function rollDice(){
    const d1=$("die1"), d2=$("die2");
    d1.classList.add("rolling"); d2.classList.add("rolling");
    for(let i=0;i<9;i++){ showDie(d1,rnd()); showDie(d2,rnd()); SND.diceClick(); await sleep(85); }
    d1.classList.remove("rolling"); d2.classList.remove("rolling");
    const a=rnd(), b=rnd();
    showDie(d1,a); showDie(d2,b);
    SND.diceLand();
    return [a,b];
  }

  /* ================= Pop-up case spéciale (4 secondes) ================= */
  async function announce(t, type, n){
    const T = TYPES[type];
    $("evIco").innerHTML = svgUse(T.icon);
    $("evEgg").replaceChildren(makeEgg(t));
    $("evName").textContent = t.name;
    $("evTitle").textContent = "tombe sur la case " + T.label + " (n° " + n + ")";
    $("evText").textContent = T.desc;
    ev.hidden = false;
    SND.special(type);
    ev.classList.remove("run"); void ev.offsetWidth; ev.classList.add("run");
    await sleep(EVENT_MS);
    ev.hidden = true;
  }

  /* ================= Déroulement ================= */
  async function beginTurn(){
    if(over) return;
    const g = gid;
    const t = teams[cur];
    renderPanel();
    $("total").textContent = "";
    if(t.skip>0){
      t.skip--;
      setStatus("Se repose à l'hôtel… son tour est passé.");
      log(t.name + " passe son tour 💤");
      busy = true; $("rollBtn").disabled = true;
      await sleep(1600);
      if(g!==gid) return;
      cur = (cur+1) % teams.length;
      return beginTurn();
    }
    setStatus("Lancez les dés !");
    busy = false; $("rollBtn").disabled = false;
    $("rollBtn").focus({preventScroll:true});
  }

  async function playTurn(){
    if(busy || over) return;
    const g = gid;
    SND.unlock();
    busy = true; $("rollBtn").disabled = true;
    const t = teams[cur];

    setStatus("Les dés roulent…");
    const [a,b] = await rollDice();
    if(g!==gid) return;
    const total = a+b;
    $("total").textContent = a + " + " + b + " = " + total;
    log(t.name + " fait " + total + " (" + a + " + " + b + ")");
    await sleep(350);

    // Déplacement case par case, avec rebond si on dépasse 63
    let p = t.pos, dir = 1;
    for(let i=0;i<total;i++){
      if(p===LAST) dir = -1;
      p += dir;
      t.pos = p;
      SND.step(i);
      renderPanel();
      await sleep(210);
      if(g!==gid) return;
    }

    if(t.pos===LAST) return finish(t);
    await resolveCell(t, g);
  }

  function nextTurn(){
    cur = (cur+1) % teams.length;
    beginTurn();
  }

  async function resolveCell(t, g){
    const type = SPECIALS[t.pos];
    if(!type){
      await sleep(600);
      if(g!==gid) return;
      return nextTurn();
    }
    const T = TYPES[type];
    setStatus("Case " + T.label + " !");
    await announce(t, type, t.pos);
    if(g!==gid) return;

    if(type==="oie"){
      log("🪿 " + t.name + " tombe sur une oie : elle rejoue !");
      setStatus("Case Oie ! Relancez les dés.");
      busy = false; $("rollBtn").disabled = false;
      $("total").textContent = "";
      $("rollBtn").focus({preventScroll:true});
      return;
    }
    if(type==="hotel"){
      t.skip = 1;
      log("🏨 " + t.name + " dort à l'hôtel : prochain tour passé.");
    } else if(type==="pont"){
      log("🌉 " + t.name + " traverse le pont (+6).");
      t.pos = Math.min(LAST, t.pos+6);
    } else if(type==="laby"){
      log("🌽 " + t.name + " se perd dans le maïs (−5).");
      t.pos -= 5;
    } else if(type==="orage"){
      log("⛈️ " + t.name + " est surpris par l'orage : retour au départ !");
      t.pos = 1;
    }
    renderPanel();
    if(t.pos===LAST) return finish(t);
    await sleep(900);
    if(g!==gid) return;
    nextTurn();
  }

  /* ================= Victoire ================= */
  function finish(t){
    over = true; busy = true;
    SND.jackpot();
    $("rollBtn").disabled = true;
    renderPanel();
    setStatus("Partie terminée !");
    log("🏆 " + t.name + " remporte la partie !");
    $("winEgg").replaceChildren(makeEgg(t));
    $("winText").textContent = "Félicitations à l'équipe « " + t.name + " » ! Son œuf atteint le nid de la case 63 et remporte la partie. Voulez-vous lancer une nouvelle partie ?";
    const w = $("win");
    w.hidden = false; w.classList.remove("go"); void w.offsetWidth; w.classList.add("go");
    FX.start();
    $("againBtn").focus();
  }

  /* ================= Effets de jackpot : confettis, pièces, paillettes, feux d'artifice ================= */
  const FX = (() => {
    const cv = $("fx"), cx = cv.getContext("2d");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const GOLD = ["#ffd43b","#ffe066","#ffb703","#fff3b0","#ffffff"];
    const MIX  = ["#ffd43b","#ef5350","#42a5f5","#66bb6a","#ab47bc","#ff9f1c","#ffffff","#26c6da"];
    let parts = [], raf = 0, run = false, W = 0, H = 0, last = 0, t0 = 0, acc = {c:0,o:0,s:0,f:0};
    const R = (a,b) => a + Math.random()*(b-a);
    const pick = a => a[(Math.random()*a.length)|0];
    function resize(){
      const d = Math.min(2, devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      cv.width = W*d; cv.height = H*d; cx.setTransform(d,0,0,d,0,0);
    }
    function confetti(){ parts.push({k:"c",x:R(0,W),y:-20,vx:R(-40,40),vy:R(120,320),w:R(6,12),h:R(10,18),rot:R(0,6.3),vr:R(-8,8),col:pick(MIX)}); }
    function coin(){ parts.push({k:"o",x:R(0,W),y:-30,vx:R(-30,30),vy:R(200,420),r:R(10,17),rot:R(0,6.3),vr:R(4,10)}); }
    function sparkle(){ parts.push({k:"s",x:R(0,W),y:R(0,H),r:R(6,20),life:R(.5,1.2),age:0,col:pick(GOLD)}); }
    function firework(x = R(W*.1, W*.9), y = R(H*.1, H*.5)){
      const c1 = pick(MIX), c2 = pick(GOLD);
      for(let i=0;i<48;i++){
        const a = (i/48)*6.283, sp = R(80,300);
        parts.push({k:"f",x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:R(.8,1.5),age:0,col:i%3 ? c1 : c2});
      }
    }
    function star(x,y,r){
      cx.beginPath();
      for(let i=0;i<8;i++){
        const a = i*Math.PI/4 - Math.PI/2, rr = i%2 ? r*0.22 : r;
        cx.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr);
      }
      cx.closePath(); cx.fill();
    }
    function step(dt){
      for(const p of parts){
        if(p.k==="c" || p.k==="o"){ p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.vr*dt; }
        else if(p.k==="f"){ p.vy += 260*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.age += dt; }
        else p.age += dt;
      }
      parts = parts.filter(p => (p.k==="c"||p.k==="o") ? p.y < H+40 : p.age < p.life);
    }
    function draw(){
      cx.clearRect(0,0,W,H);
      for(const p of parts){
        if(p.k==="c"){
          cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.scale(1, Math.cos(p.rot*1.7));
          cx.fillStyle = p.col; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
        } else if(p.k==="o"){
          const rx = Math.max(1.5, p.r*Math.abs(Math.cos(p.rot)));
          cx.save(); cx.translate(p.x,p.y);
          cx.beginPath(); cx.ellipse(0,0,rx,p.r,0,0,6.283);
          cx.fillStyle = "#ffd43b"; cx.fill(); cx.lineWidth = 2; cx.strokeStyle = "#b8860b"; cx.stroke();
          if(rx > 5){ cx.beginPath(); cx.ellipse(0,0,rx*0.55,p.r*0.55,0,0,6.283); cx.lineWidth = 1.5; cx.strokeStyle = "#e0a800"; cx.stroke(); }
          cx.restore();
        } else if(p.k==="s"){
          cx.globalAlpha = Math.sin(Math.PI*p.age/p.life); cx.fillStyle = p.col; star(p.x,p.y,p.r); cx.globalAlpha = 1;
        } else {
          cx.globalAlpha = Math.max(0, 1 - p.age/p.life); cx.fillStyle = p.col;
          cx.beginPath(); cx.arc(p.x,p.y,2.6,0,6.283); cx.fill(); cx.globalAlpha = 1;
        }
      }
    }
    function loop(ts){
      if(!run) return;
      const dt = Math.min(0.05, (ts-last)/1000); last = ts;
      const el = (ts-t0)/1000, k = (el < 7 ? 1 : 0.35) * (reduce ? 0.25 : 1);
      acc.c += dt*90*k; acc.o += dt*14*k; acc.s += dt*45*k; acc.f += dt*2.2*k;
      while(acc.c>=1){ acc.c--; if(parts.length<900) confetti(); }
      while(acc.o>=1){ acc.o--; coin(); }
      while(acc.s>=1){ acc.s--; sparkle(); }
      while(acc.f>=1){ acc.f--; firework(); }
      step(dt); draw();
      raf = requestAnimationFrame(loop);
    }
    addEventListener("resize", () => { if(run) resize(); });
    return {
      start(){
        resize(); parts = []; acc = {c:0,o:0,s:0,f:0}; run = true;
        last = t0 = performance.now();
        firework(W*.25,H*.3); firework(W*.75,H*.3); firework(W*.5,H*.2);
        raf = requestAnimationFrame(loop);
      },
      stop(){ run = false; cancelAnimationFrame(raf); parts = []; cx.clearRect(0,0,W,H); }
    };
  })();

  function closeWin(){ $("win").hidden = true; FX.stop(); SND.stop(); }

  /* ================= Navigation ================= */
  function startGame(){
    SND.unlock();
    const inputs = [...document.querySelectorAll("#teamFields input")];
    names = inputs.map(i=>i.value);
    teams = inputs.map((inp,i)=>({
      idx: i,
      name: inp.value.trim() || ("Équipe " + (i+1)),
      color: COLORS[i], pos: 1, skip: 0
    }));
    gid++; cur = 0; over = false; busy = false;
    setup.hidden = true; game.hidden = false; $("quitBtn").hidden = false;
    $("log").innerHTML = ""; $("total").textContent = "";
    showDie($("die1"),1); showDie($("die2"),1);
    buildBoard();
    log("La partie commence : " + teams.length + " équipes !");
    beginTurn();
    window.scrollTo(0,0);
  }

  function backToSetup(){
    gid++;
    closeWin(); tip.hidden = true; ev.hidden = true;
    game.hidden = true; setup.hidden = false; $("quitBtn").hidden = true;
    over = false; busy = false;
    renderFields();
  }

  $("startBtn").onclick = startGame;
  $("soundBtn").onclick = () => {
    const on = SND.toggle();
    $("soundBtn").textContent = on ? "Son : activé" : "Son : coupé";
    $("soundBtn").setAttribute("aria-pressed", on);
  };
  $("rollBtn").onclick = playTurn;
  $("againBtn").onclick = backToSetup;
  $("noBtn").onclick = closeWin;
  $("quitBtn").onclick = () => {
    if(over || confirm("Quitter la partie en cours et revenir au choix des équipes ?")) backToSetup();
  };
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape" && !$("win").hidden) closeWin();
  });

  /* ================= Infobulle des cases spéciales ================= */
  function showTip(el, x, y){
    const info = el.dataset.info;
    if(!info) return hideTip();
    const [title, text] = info.split("|");
    tip.innerHTML = "";
    const b = document.createElement("b"); b.textContent = title;
    tip.append(b, document.createTextNode(text));
    tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let left = x + 16, top = y + 16;
    if(left + w > innerWidth - 8) left = x - w - 16;
    if(top + h > innerHeight - 8) top = y - h - 16;
    tip.style.left = Math.max(8,left) + "px";
    tip.style.top = Math.max(8,top) + "px";
  }
  function hideTip(){ tip.hidden = true; }

  board.addEventListener("mousemove", e=>{
    const el = e.target.closest(".cell[data-info]");
    el ? showTip(el, e.clientX, e.clientY) : hideTip();
  });
  board.addEventListener("mouseleave", hideTip);
  board.addEventListener("focusin", e=>{
    const el = e.target.closest(".cell[data-info]");
    if(el){ const r = el.getBoundingClientRect(); showTip(el, r.right, r.top); }
  });
  board.addEventListener("focusout", hideTip);

  /* ================= Démarrage ================= */
  renderFields();
})();
</script>
</body>
</html>
